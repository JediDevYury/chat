directive @authenticated on FIELD_DEFINITION

"""
    Scalar types
"""

scalar Date

"""
    User type
"""

type User {
    id: ID!
    fullName: String
    email: String!
    createdAt: Date!
}

type AuthTokens {
    accessToken: String!
    refreshToken: String!
}

"""
    Inputs for the authentication
"""

input TokenInput {
    token: String!
}

input RefreshTokenInput {
    refreshToken: String!
}

"""
    Inputs for the users
"""

input UpdateUserInput {
    fullName: String
    email: String
}


"""
    Query types
"""
type Query {
    users: [User!]!
    user(id: ID!): User! @authenticated
}

"""
    Mutation types
"""

type Mutation {
    updateUser(id: ID!, updateUserInput: UpdateUserInput!): User!
    deleteUser(id: ID!): User

    authenticate(googleTokenInput: TokenInput!): User
    refreshTokens(refreshTokenInput: RefreshTokenInput!): AuthTokens
}
